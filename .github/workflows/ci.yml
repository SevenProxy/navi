name: Navi

on:
  push:
    branches: [ 'main' ]
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -L -o trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf trunk.tar.gz
          chmod +x trunk
          sudo mv trunk /usr/local/bin/

      - name: Cargo Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Cargo Clippy
        run: cargo clippy -- -D warnings

      - name: Trunk Build
        run: trunk build --release
